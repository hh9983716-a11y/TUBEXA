<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TUBEXA - Premium YouTube Video Streaming Platform</title>
    <meta name="description" content="TUBEXA is a premium, responsive YouTube video streaming platform with official IFrame playback, instant URL pasting, curated channels, and PWA capabilities." />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="TUBEXA - Premium YouTube Video Streaming Platform" />
    <meta property="og:description" content="TUBEXA is a premium, responsive YouTube video streaming platform with official IFrame playback, instant URL pasting, curated channels, and PWA capabilities." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TUBEXA - Premium YouTube Video Streaming Platform" />
    <meta name="twitter:description" content="TUBEXA is a premium, responsive YouTube video streaming platform with official IFrame playback, instant URL pasting, curated channels, and PWA capabilities." />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TUBEXA" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- DNS prefetch & preconnect for lightning-fast YouTube stream initialization -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#08080a] text-neutral-100 antialiased selection:bg-red-600 selection:text-white min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
